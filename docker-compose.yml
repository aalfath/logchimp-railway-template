# Local test only: mirrors the Railway template (Postgres + LogChimp API + LogChimp web).
name: her-2251
services:
  postgres:
    image: postgres:17-alpine
    labels: [her=2251]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localtestpassword
      POSTGRES_DB: railway
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d railway"]
      interval: 3s
      retries: 20
  api:
    build: ./api
    labels: [her=2251]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      LOGCHIMP_DB_URL: postgresql://postgres:localtestpassword@postgres:5432/railway
      LOGCHIMP_SECRET_KEY: local-test-secret-key-0123456789abcdef0123456789abcdef
      LOGCHIMP_MACHINE_SIGNATURE: local-test-machine-signature-0123
      LOGCHIMP_WEB_URL: http://localhost:42251
      PORT: "8080"
  web:
    build: ./web
    labels: [her=2251]
    depends_on: [api]
    environment:
      PORT: "42251"
      LOGCHIMP_API_UPSTREAM: api:8000
    ports: ["42251:42251"]
volumes:
  pgdata:
